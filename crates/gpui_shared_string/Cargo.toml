[package]
name = "skathi-gpui-shared-string"
version.workspace = true
description = "SharedString, the cheaply cloned string type of skathi-gpui"
license.workspace = true
repository.workspace = true
homepage.workspace = true
include = ["gpui_shared_string.rs", "LICENSE-APACHE"]
edition.workspace = true

[lib]
name = "gpui_shared_string"
path = "gpui_shared_string.rs"
test = false
doctest = false

[features]
schemars = ["dep:schemars"]

[dependencies]
schemars = { workspace = true, optional = true }
serde.workspace = true
smol_str = { version = "0.3.6", default-features = false, features = ["serde"] }

[lints]
workspace = true
