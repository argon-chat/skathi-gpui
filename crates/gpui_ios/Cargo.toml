[package]
name = "skathi-gpui-ios"
version.workspace = true
description = "iOS platform for skathi-gpui: UIKit"
license.workspace = true
repository.workspace = true
homepage.workspace = true
include = ["src/**/*", "LICENSE-APACHE", "NOTICE"]
edition.workspace = true

[lints]
workspace = true

[lib]
name = "gpui_ios"
path = "src/gpui_ios.rs"
crate-type = ["staticlib", "rlib"]
doctest = false

[[example]]
name = "ios"
path = "examples/ios.rs"
test = false
bench = false

[[test]]
name = "text_input"
path = "tests/text_input.rs"
harness = false

[features]
runtime_shaders = ["gpui_apple/runtime_shaders"]


[target.'cfg(target_os = "ios")'.dev-dependencies]
# Path only, so packaging drops it: as a versioned dev-dependency it would be a publish cycle.
gpui_platform = { package = "skathi-gpui-platform", path = "../gpui_platform", default-features = false }
objc2-ui-kit = { workspace = true, features = ["UIConversationContext"] }
slotmap.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
anyhow.workspace = true
block2.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_apple = { workspace = true, features = ["font-kit"] }
log.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSThread", "NSOperation", "NSUserActivity", "block2"] }
objc2-ui-kit.workspace = true
objc2-quartz-core = { workspace = true, features = ["CADisplayLink"] }
objc2-core-foundation = { workspace = true, default-features = true }
parking_lot.workspace = true
raw-window-handle.workspace = true
uuid = { workspace = true, features = ["v5"] }
