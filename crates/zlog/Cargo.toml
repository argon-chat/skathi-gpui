[package]
name = "skathi-gpui-zlog"
version.workspace = true
description = "Logging for skathi-gpui"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
include = ["src/**/*", "README.md", "LICENSE-APACHE", "NOTICE"]
edition.workspace = true

[lints]
workspace = true

[lib]
name = "zlog"
path = "src/zlog.rs"
doctest = false

[features]
default = []

[dependencies]
collections.workspace = true
chrono = { workspace = true, default-features = true }
log = { workspace = true, features = ["kv_unstable_std"] }
anyhow.workspace = true

[dev-dependencies]
tempfile.workspace = true
