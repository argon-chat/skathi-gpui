[package]
name = "skathi-gpui-macros"
version.workspace = true
description = "Derive and attribute macros for skathi-gpui"
license.workspace = true
repository.workspace = true
homepage.workspace = true
include = ["src/**/*", "LICENSE-APACHE"]
edition.workspace = true

[lints]
workspace = true

[features]
inspector = []
schemars = []

[lib]
name = "gpui_macros"
path = "src/gpui_macros.rs"
proc-macro = true
doctest = true
test = false

[dependencies]
heck.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, default-features = true, features = ["full", "extra-traits", "visit-mut"] }

[dev-dependencies]
# Path only, so packaging drops it: as a versioned dev-dependency it would be a publish cycle.
gpui = { package = "skathi-gpui", path = "../gpui", default-features = false, features = ["inspector"] }
